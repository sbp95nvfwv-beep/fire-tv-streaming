services:
  media-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      PORT: 8080
      MEDIA_DIR: /data/media
      CATALOG_FILE: /data/catalog.json
    volumes:
      - media_data:/data
    restart: unless-stopped

volumes:
  media_data:
