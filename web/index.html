<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire TV Streaming · Verwaltung</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Fire TV Streaming</h1><p>Videos für deine private Mediathek hochladen.</p><form id="upload"><label>Admin-Token <input id="token" type="password" required autocomplete="current-password"></label><label>Titel <input name="title" required></label><label>Beschreibung <textarea name="description"></textarea></label><label>Video <input name="video" type="file" accept="video/*" required></label><button>Hochladen</button></form><p id="status" role="status"></p><h2>Bibliothek</h2><div id="library"></div></main><script src="app.js"></script></body></html>
